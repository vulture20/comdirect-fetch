# MariaDB läuft extern beim Nutzer und ist bewusst nicht Teil dieser Compose-Datei
# (KONZEPT.md Abschnitt 2). Grafana ebenso: Es lief bereits eine eigene Instanz auf dem
# ursprünglichen Zielhost, daher werden Datenquelle + Dashboards dort per Grafana-API
# eingerichtet statt über einen eigenen Grafana-Container hier (siehe README.md).

services:
  fetch:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    restart: unless-stopped
    ports:
      - "8750:8080"
